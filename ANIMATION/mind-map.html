<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Mind Map Revision – Prepared by Mr. Beda</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}

body.in-map #home{opacity:0;transform:scale(.97);visibility:hidden}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;width:100%;max-width:520px}
h1{margin:0;text-align:center;font:800 clamp(36px,9vw,64px)/1.05 Sora,"Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;flex-direction:column;gap:16px;width:100%}
.big{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:72px;padding:18px 26px;border-radius:20px;color:#fff;font:700 clamp(18px,4.8vw,22px) Sora,"Atkinson Hyperlegible",sans-serif;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.25,1.2),box-shadow .3s,filter .3s}
.big:nth-child(2){background:linear-gradient(135deg,var(--b),#c04f9a)}
.big svg{flex:none;width:26px;height:26px;transition:transform .3s}
.big:hover{transform:translateY(-5px) scale(1.02);filter:brightness(1.08);box-shadow:0 22px 40px -14px var(--b)}
.big:hover svg{transform:translateX(6px)}
.big:active{transform:scale(.97)}
.big:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.by{font-size:15px;color:var(--mute);text-align:center}
.by b{color:var(--ink)}
/* MAP SCREEN */
#mapscreen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--card);transform:translateX(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.85,.25,1),visibility .45s}
body.in-map #mapscreen{transform:none;visibility:visible}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.top h2{flex:1;min-width:0;margin:0;font:700 clamp(15px,4vw,19px)/1.2 Sora,"Atkinson Hyperlegible",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;white-space:nowrap;transition:transform .2s,box-shadow .2s,border-color .2s}
.top button:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--a)}
.top button:active{transform:scale(.95)}
#back{display:flex;align-items:center;gap:6px;color:#fff;border:0;background:linear-gradient(135deg,var(--a),var(--b))}
@media (max-width:520px){.top .opt{padding:8px 11px;font-size:14px}}
#canvas{flex:1;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;cursor:grab;background:var(--card)}
#canvas.drag{cursor:grabbing}
.inner{position:relative;width:max-content;min-width:100%;padding:36px 60px calc(60px + env(safe-area-inset-bottom,0px)) 22px}
svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg path{fill:none;stroke-width:2.4;stroke-linecap:round}
ul{list-style:none;margin:0;padding:0}
li.node{display:flex;align-items:center}
.kids{display:none;flex-direction:column;margin-left:54px}
li.open>.kids{display:flex;animation:in .38s cubic-bezier(.2,.8,.25,1)}
@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.self{all:unset;box-sizing:border-box;position:relative;display:block;max-width:290px;min-width:80px;margin:7px 0;padding:10px 30px 9px 6px;border-bottom:2.5px solid hsl(var(--h) 60% 42%);line-height:1.4;border-radius:8px 8px 0 0;transition:background .25s,transform .25s,border-color .25s}
button.self{cursor:pointer;font-weight:700;font-size:17px;color:var(--ink)}
button.self:hover{background:hsl(var(--h) 70% 50%/.14);transform:translateX(3px)}
button.self:focus-visible{outline:3px solid hsl(var(--h) 70% 50%);outline-offset:2px}
.leafself{font-size:16px;color:var(--ink);max-width:360px;padding-right:14px;border-bottom-width:2px}
.leafself:hover{background:hsl(var(--h) 70% 50%/.12);transform:translateX(4px)}
.dot{position:absolute;right:-14px;bottom:-15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 Sora,sans-serif;color:#fff;background:hsl(var(--h) 62% 40%);border:3px solid hsl(var(--h) 62% 40%);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s,box-shadow .25s;z-index:2}
.dot::after{content:"";position:absolute;inset:-12px}
button.self:hover .dot{transform:scale(1.2);box-shadow:0 0 0 6px hsl(var(--h) 70% 50%/.22)}
li.open>.self>.dot{background:var(--card);color:var(--ink)}
button.self:active .dot{transform:scale(.8)}
.root>.self{font:700 21px/1.3 Sora,"Atkinson Hyperlegible",sans-serif;max-width:270px;padding-bottom:14px}
.root>.self .dot{width:36px;height:36px;right:-18px;bottom:-19px;font-size:14px}
.hint>.self>.dot{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 hsl(var(--h) 70% 50%/.65)}100%{box-shadow:0 0 0 24px hsl(var(--h) 70% 50%/0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div></div>
  <div class="mid">
    <h1>Mind Map Revision</h1>
    <div class="btns">
      <button class="big" data-k="representation">Data Representation<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

  <div class="by">Prepared by <b>Mr. Beda</b></div>

const MAPS={representation:D1,transmission:D2};
const tree=document.getElementById('tree'),svg=document.getElementById('svg'),inner=document.getElementById('inner'),canvas=document.getElementById('canvas'),ttl=document.getElementById('ttl');
const all=[];let current='';
function make(node,hue){
  const li=document.createElement('li');li.className='node';li.style.setProperty('--h',hue);
  if(typeof node==='string'){
    const d=document.createElement('div');d.className='self leafself';d.textContent=node;li.appendChild(d);return li;
  }
  const kids=node.slice(1);
  const b=document.createElement('button');b.className='self';b.setAttribute('aria-expanded','false');
  const t=document.createElement('span');t.textContent=node[0];
  const dot=document.createElement('span');dot.className='dot';dot.textContent=kids.length;
  b.append(t,dot);li.appendChild(b);
  const ul=document.createElement('ul');ul.className='kids';
  kids.forEach(k=>ul.appendChild(make(k,hue)));
  li.appendChild(ul);
  b.onclick=()=>{set(li,!li.classList.contains('open'));if(li.classList.contains('open'))reveal(li);};
  all.push(li);return li;
}
function set(li,open,skip){
  li.classList.toggle('open',open);li.classList.remove('hint');
  li.querySelector(':scope>.self').setAttribute('aria-expanded',open);
  if(!skip)draw();
}
function draw(){
  requestAnimationFrame(()=>{
    const ir=inner.getBoundingClientRect();
    svg.setAttribute('width',inner.scrollWidth);svg.setAttribute('height',inner.scrollHeight);
    let h='';
    inner.querySelectorAll('li.open').forEach(li=>{
      const p=li.querySelector(':scope>.self').getBoundingClientRect();
      const x1=p.right-ir.left,y1=p.bottom-ir.top-1;
      li.querySelectorAll(':scope>.kids>li>.self').forEach(c=>{
        const r=c.getBoundingClientRect();
        const x2=r.left-ir.left,y2=r.bottom-ir.top-1,m=(x1+x2)/2;
        const hue=getComputedStyle(c).getPropertyValue('--h')||200;
        h+='<path d="M'+x1+' '+y1+'C'+m+' '+y1+' '+m+' '+y2+' '+x2+' '+y2+'" stroke="hsl('+hue+' 55% 50%)"/>';
      });
    });
    svg.innerHTML=h;
  });
}
function reveal(li){
  setTimeout(()=>{
    const cr=canvas.getBoundingClientRect(),s=li.querySelector(':scope>.self').getBoundingClientRect();
    const k=li.querySelector(':scope>.kids').getBoundingClientRect();
    let dx=0,dy=0;
    if(cr.width<700)dx=s.left-cr.left-16;
    else if(k.right>cr.right-20)dx=Math.min(k.right-cr.right+40,s.left-cr.left-16);
    const cy=(k.top+k.bottom)/2;
    dy=k.height<cr.height?cy-(cr.top+cr.height/2):k.top-cr.top-20;
    canvas.scrollBy({left:dx,top:dy,behavior:'smooth'});
  },60);
}
function build(D){
  tree.innerHTML='';all.length=0;svg.innerHTML='';
  const root=document.createElement('li');root.className='node root hint';root.style.setProperty('--h',200);
  const rb=document.createElement('button');rb.className='self';rb.setAttribute('aria-expanded','false');
  const rt=document.createElement('span');rt.textContent=D[0];
  const rd=document.createElement('span');rd.className='dot';rd.textContent=D.length-1;
  rb.append(rt,rd);root.appendChild(rb);
  const ru=document.createElement('ul');ru.className='kids';
  D.slice(1).forEach((n,i)=>ru.appendChild(make(n,(i*47+190)%360)));
  root.appendChild(ru);all.push(root);
  rb.onclick=()=>{set(root,!root.classList.contains('open'));if(root.classList.contains('open'))reveal(root);};
  tree.appendChild(root);
  canvas.scrollTo(0,0);draw();
}
function route(){
  const k=location.hash.slice(1);
  if(MAPS[k]){
    if(k!==current){current=k;build(MAPS[k]);ttl.textContent=(k==='transmission'?'Data Transmission':'Data Representation');document.title=ttl.textContent+' – Mind Map Revision by Mr. Beda';}
    document.body.classList.add('in-map');
    setTimeout(draw,480);
  }else{
    document.body.classList.remove('in-map');current='';document.title='Mind Map Revision – Prepared by Mr. Beda';
  }
}
document.querySelectorAll('.big').forEach(b=>b.onclick=()=>{location.hash=b.dataset.k;});
document.getElementById('back').onclick=()=>{if(history.length>1&&location.hash){history.back();setTimeout(()=>{if(location.hash)location.hash='';},150);}else location.hash='';};
document.getElementById('ex').onclick=()=>{all.forEach(l=>set(l,true,true));draw();};
document.getElementById('co').onclick=()=>{all.forEach(l=>set(l,false,true));draw();canvas.scrollTo({left:0,top:0,behavior:'smooth'});};
let pd=null;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('button'))return;pd={x:e.clientX,y:e.clientY,l:canvas.scrollLeft,t:canvas.scrollTop};canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!pd)return;canvas.scrollLeft=pd.l-(e.clientX-pd.x);canvas.scrollTop=pd.t-(e.clientY-pd.y);});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>{pd=null;canvas.classList.remove('drag');}));
addEventListener('resize',draw);
addEventListener('hashchange',route);
if(document.fonts)document.fonts.ready.then(draw);
route();
</script>
