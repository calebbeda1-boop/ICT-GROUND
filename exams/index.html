<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ICT Ground | Al Muntazir Islamic Int'l School</title>
<style>
:root{
  --navy:#1a3a6b; --navy-dark:#0f2347; --gold:#b8860b; --gold-light:#f5efd8;
  --ink:#1e293b; --muted:#64748b; --bg:#f6f5f1; --card:#ffffff; --border:#e5e2d8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Georgia','Times New Roman',serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column;
}
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);
  color:#fff; padding:48px 24px 40px; text-align:center; position:relative;
}
header::after{
  content:''; position:absolute; bottom:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.eyebrow{
  font-family:'Segoe UI',Arial,sans-serif; font-size:.72rem; letter-spacing:3px;
  text-transform:uppercase; color:#c9d6ea; margin-bottom:10px;
}
h1{font-size:1.9rem; font-weight:400; letter-spacing:.5px}
.tagline{
  font-family:'Segoe UI',Arial,sans-serif; font-size:.85rem; color:#aebedd;
  margin-top:8px;
}

main{flex:1; max-width:880px; margin:0 auto; padding:44px 20px 60px; width:100%}

.section-label{
  font-family:'Segoe UI',Arial,sans-serif; font-size:.72rem; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:14px;
}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:4px;
  padding:24px; text-decoration:none; color:inherit; display:block;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  position:relative; overflow:hidden;
}
.card::before{
  content:''; position:absolute; top:0; left:0; width:3px; height:100%;
  background:var(--navy);
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(26,58,107,.12);
  border-color:var(--navy);
}
.card-subject{
  font-family:'Segoe UI',Arial,sans-serif; font-size:.68rem; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px;
}
.card h2{font-size:1.2rem; font-weight:600; color:var(--navy); margin-bottom:8px; line-height:1.3}
.card p{font-family:'Segoe UI',Arial,sans-serif; font-size:.84rem; color:var(--muted); line-height:1.5; margin-bottom:14px}
.card-meta{
  font-family:'Segoe UI',Arial,sans-serif; font-size:.72rem; color:var(--gold);
  font-weight:700; display:flex; align-items:center; gap:6px;
}

.empty-note{
  font-family:'Segoe UI',Arial,sans-serif; color:var(--muted); font-size:.88rem;
  padding:30px; text-align:center; border:1px dashed var(--border); border-radius:4px;
}

footer{
  text-align:center; padding:26px 20px; font-family:'Segoe UI',Arial,sans-serif;
  font-size:.72rem; color:var(--muted); border-top:1px solid var(--border);
}
footer a{color:var(--navy); text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Al Muntazir Islamic International School</div>
  <h1>ICT Ground</h1>
  <div class="tagline">Department of Computer Science — Assessments &amp; Learning Projects</div>
</header>

<main>
  <div class="section-label">Available Assessments</div>
  <div class="grid" id="exam-grid"></div>
  <div class="empty-note" id="empty-note" style="display:none">Hakuna mtihani uliowekwa bado.</div>
</main>

<footer>
  Al Muntazir Islamic Int'l School · ICT Department &nbsp;·&nbsp; <a href="/admin.html">Staff Login</a>
</footer>

<script>
/* Ongeza mtihani/mradi mpya hapa chini — nakili block moja, badilisha maudhui, weka kwenye orodha. */
const EXAMS = [
  {
    subject: 'Year 10 · Computer Science',
    title: 'Data Representation Test',
    description: 'Baseline assessment covering binary conversion, denary conversion, and binary addition.',
    url: '/exams/data-representation.html'
  }
];

const grid = document.getElementById('exam-grid');
if(EXAMS.length === 0){
  document.getElementById('empty-note').style.display = 'block';
} else {
  grid.innerHTML = EXAMS.map(e => `
    <a class="card" href="${e.url}">
      <div class="card-subject">${esc(e.subject)}</div>
      <h2>${esc(e.title)}</h2>
      <p>${esc(e.description)}</p>
      <div class="card-meta">Anza mtihani →</div>
    </a>
  `).join('');
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

</body>
</html>
