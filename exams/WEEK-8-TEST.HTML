body{min-height:100dvh;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.panel{width:min(92vw,760px);background:rgba(255,255,255,.96);border:1px solid var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.14);padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vw,24px);text-align:center;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.logo{height:clamp(64px,13vw,92px);animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
.rule{width:64px;height:2px;background:var(--ink);transform-origin:center;animation:grow 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.eyebrow{font:600 .78rem/1 system-ui,Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;animation:rise 1s .3s both}
h1{font-size:clamp(2.1rem,7vw,3.8rem);font-weight:400;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;animation:rise 1s .4s both}
.when{font:400 clamp(.95rem,2.4vw,1.15rem)/1.5 Georgia,serif;font-style:italic;animation:rise 1s .5s both}
.clock{display:grid;grid-template-columns:repeat(4,1fr);width:100%;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);animation:rise 1s .6s both}
.u{padding:clamp(14px,3vw,26px) 4px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .4s,color .4s}
.u+.u{border-left:1px solid var(--ink)}
.u:hover,.u:active{background:var(--ink);color:var(--paper)}
.num{display:flex;font-size:clamp(2.2rem,9.5vw,4.6rem);font-variant-numeric:tabular-nums;line-height:1}
.d{height:1em;overflow:hidden;width:.62em}
.col{display:flex;flex-direction:column;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.col i{display:block;height:1em;line-height:1em;font-style:normal;text-align:center}
.lab{font:600 clamp(.6rem,1.9vw,.75rem)/1 system-ui,Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase}
.msg{display:none;flex-direction:column;align-items:center;gap:18px}
.done .clock,.done .eyebrow{display:none}.done .msg{display:flex;animation:rise 1s both}
.go{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:clamp(14px,3vw,20px) clamp(22px,5vw,44px);font:600 clamp(.85rem,2.4vw,1.05rem)/1 system-ui,Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;transition:background .5s,color .5s,transform .4s cubic-bezier(.22,1,.36,1),letter-spacing .5s}
.go:hover{background:var(--paper);color:var(--ink);letter-spacing:.32em}.go:active{transform:scale(.97)}.go b{font-weight:400;transition:transform .5s cubic-bezier(.22,1,.36,1)}.go:hover b{transform:translateX(8px)}
.best{font-style:italic;font-size:clamp(1.1rem,3.4vw,1.6rem);letter-spacing:.14em;text-transform:uppercase}
.note{font:400 clamp(.78rem,2vw,.92rem)/1.6 system-ui,Arial,sans-serif;letter-spacing:.05em;border-top:1px solid var(--ink);padding-top:16px;max-width:520px;animation:rise 1s .75s both}.note b{letter-spacing:.2em}
.foot{font:600 .72rem/1 system-ui,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;animation:rise 1s .8s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
