<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Results — Data Representation Test | Al Muntazir</title>
<style>
:root{
  --primary:#1a3a6b; --primary-dark:#0f2347; --accent:#2563eb; --accent-light:#dbeafe;
  --green:#16a34a; --gold:#b45309; --danger:#dc2626; --card:#fff; --bg:#f1f5f9;
  --border:#e2e8f0; --muted:#64748b; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#1e293b;min-height:100vh}
header{background:var(--primary);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:1.05rem;font-weight:800}
header p{font-size:.78rem;opacity:.8}
main{max-width:1100px;margin:0 auto;padding:24px 16px}

#gate{max-width:360px;margin:60px auto;background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-top:5px solid var(--primary)}
#gate h2{font-size:1.1rem;margin-bottom:14px;color:var(--primary)}
#gate input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:.95rem;margin-bottom:10px}
#gate button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:.9rem}
#gate .err{color:var(--danger);font-size:.82rem;margin-top:8px;display:none}

#dash{display:none}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--primary)}
.stat .l{font-size:.75rem;color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=text]{flex:1;min-width:180px;padding:9px 12px;border:2px solid var(--border);border-radius:8px;font-size:.88rem}
.toolbar button{padding:9px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:.82rem}
.toolbar button.secondary{background:#e5e7eb;color:var(--primary)}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06)}
th,td{padding:10px 12px;text-align:left;font-size:.85rem;border-bottom:1px solid var(--border)}
th{background:var(--primary-dark);color:#fff;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:var(--primary)}
tr:hover td{background:var(--accent-light)}
.grade-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:800;font-size:.75rem}
.g-A{background:#dcfce7;color:var(--green)} .g-B{background:#dbeafe;color:var(--accent)}
.g-C{background:#fef3c7;color:var(--gold)} .g-D,.g-E,.g-F{background:#fee2e2;color:var(--danger)}
.flag{color:var(--danger);font-weight:700}
.empty{text-align:center;padding:40px;color:var(--muted)}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab-btn{padding:9px 18px;border:2px solid var(--border);background:#fff;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pdf-link{display:inline-block;padding:5px 14px;background:var(--accent);color:#fff;border-radius:6px;font-size:.78rem;font-weight:700;text-decoration:none}
.pdf-missing{color:var(--muted);font-size:.78rem;font-style:italic}
</style>
</head>
<body>

<div id="gate">
  <h2>TEACHER</h2>
  <input type="password" id="pw" placeholder="Admin password" autocomplete="off">
  <button onclick="login()">Login</button>
  <div class="err" id="gate-err">Wrong Password.</div>
</div>

<div id="dash">
  <header>
    <div>
      <h1>Matokeo — Data Representation Test</h1>
      <p>Year 10 · Al Muntazir Islamic International School</p>
    </div>
    <button onclick="logout()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.8rem">Toka</button>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-results-btn" onclick="switchTab('results')">📊 Results (Excel)</button>
      <button class="tab-btn" id="tab-pdfs-btn" onclick="switchTab('pdfs')">📄 PDF Examination</button>
    </div>

    <div id="view-results">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Find name, campus or Class..." oninput="render()">
      <button class="secondary" onclick="load()">↻ Reload</button>
      <button onclick="exportCsv()">⬇ Download CSV (Excel)</button>
    </div>
    <table id="tbl">
      <thead>
        <tr>
          <th onclick="sortBy('name')">Name</th>
          <th onclick="sortBy('cand')">Campus/Wing</th>
          <th onclick="sortBy('cls')">Class</th>
          <th onclick="sortBy('totalCorrect')">Mark</th>
          <th onclick="sortBy('pct')">%</th>
          <th onclick="sortBy('grade')">Grade</th>
          <th onclick="sortBy('penaltyMarks')">Penalt</th>
          <th onclick="sortBy('tabSwitchCount')">Tab-switch</th>
          <th onclick="sortBy('submittedAt')">Time</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No results.</div>
    </div>

    <div id="view-pdfs" style="display:none">
      <div class="toolbar">
        <input type="text" id="pdf-search" placeholder="Find name, campus or Class..." oninput="renderPdfs()">
      </div>
      <table id="pdf-tbl">
        <thead>
          <tr>
            <th>Jina</th>
            <th>Campus/Wing</th>
            <th>Class</th>
            <th>Mark</th>
            <th>Grade</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="pdf-tbody"></tbody>
      </table>
      <div class="empty" id="pdf-empty" style="display:none">No PDF.</div>
    </div>
  </main>
</div>

<script>
let DATA = [];
let sortKey = 'submittedAt', sortDir = -1;

function login(){
  const pw = document.getElementById('pw').value;
  sessionStorage.setItem('admin_pw', pw);
  load();
}
function logout(){
  sessionStorage.removeItem('admin_pw');
  document.getElementById('dash').style.display='none';
  document.getElementById('gate').style.display='block';
}

async function load(){
  const pw = sessionStorage.getItem('admin_pw') || '';
  const res = await fetch('/api/results', { headers: { 'x-admin-password': pw } });
  if(res.status === 401){
    document.getElementById('gate-err').style.display='block';
    document.getElementById('gate').style.display='block';
    document.getElementById('dash').style.display='none';
    return;
  }
  const data = await res.json();
  DATA = data.submissions || [];
  document.getElementById('gate').style.display='none';
  document.getElementById('dash').style.display='block';
  renderSummary();
  render();
  renderPdfs();
}

function renderSummary(){
  const n = DATA.length;
  const avg = n ? Math.round(DATA.reduce((a,d)=>a+d.pct,0)/n) : 0;
  const flagged = DATA.filter(d=>d.tabSwitchCount>=3).length;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="n">${n}</div><div class="l">Submitted</div></div>
    <div class="stat"><div class="n">${avg}%</div><div class="l">Class Average</div></div>
    <div class="stat"><div class="n">${flagged}</div><div class="l">Cheat Attempt ≥3</div></div>
  `;
}

function sortBy(key){
  sortDir = (sortKey===key) ? -sortDir : 1;
  sortKey = key;
  render();
}

function render(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  let rows = DATA.filter(d =>
    !q || (d.name||'').toLowerCase().includes(q) || (d.cand||'').toLowerCase().includes(q) || (d.cls||'').toLowerCase().includes(q)
  );
  rows.sort((a,b)=>{
    const va=a[sortKey], vb=b[sortKey];
    if(typeof va==='string') return sortDir*va.localeCompare(vb);
    return sortDir*((va||0)-(vb||0));
  });
  const tbody = document.getElementById('tbody');
  document.getElementById('empty').style.display = rows.length ? 'none':'block';
  tbody.innerHTML = rows.map(d=>`
    <tr>
      <td>${esc(d.name)}</td>
      <td>${esc(d.cand)}</td>
      <td>${esc(d.cls)}</td>
      <td>${d.totalCorrect}/${d.totalMarks}</td>
      <td>${d.pct}%</td>
      <td><span class="grade-pill g-${esc(d.grade)}">${esc(d.grade)}</span></td>
      <td>${d.penaltyMarks||0}</td>
      <td>${d.tabSwitchCount>=3?'<span class="flag">'+d.tabSwitchCount+'</span>':d.tabSwitchCount}</td>
      <td>${new Date(d.submittedAt).toLocaleString('en-GB')}</td>
    </tr>
  `).join('');
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function exportCsv(){
  const headers = ['Name','Campus','Class','Score','Total','Percent','Grade','Penalty','TabSwitches','SubmittedAt'];
  const lines = [headers.join(',')];
  DATA.forEach(d=>{
    lines.push([d.name,d.cand,d.cls,d.totalCorrect,d.totalMarks,d.pct,d.grade,d.penaltyMarks||0,d.tabSwitchCount,new Date(d.submittedAt).toISOString()]
      .map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data_rep_results.csv';
  a.click();
}

function switchTab(name){
  document.getElementById('view-results').style.display = name==='results' ? 'block':'none';
  document.getElementById('view-pdfs').style.display = name==='pdfs' ? 'block':'none';
  document.getElementById('tab-results-btn').classList.toggle('active', name==='results');
  document.getElementById('tab-pdfs-btn').classList.toggle('active', name==='pdfs');
  if(name==='pdfs') renderPdfs();
}

function renderPdfs(){
  const q = (document.getElementById('pdf-search').value||'').toLowerCase();
  let rows = DATA.filter(d =>
    !q || (d.name||'').toLowerCase().includes(q) || (d.cand||'').toLowerCase().includes(q) || (d.cls||'').toLowerCase().includes(q)
  );
  const tbody = document.getElementById('pdf-tbody');
  document.getElementById('pdf-empty').style.display = rows.length ? 'none':'block';
  tbody.innerHTML = rows.map(d=>`
    <tr>
      <td>${esc(d.name)}</td>
      <td>${esc(d.cand)}</td>
      <td>${esc(d.cls)}</td>
      <td>${d.totalCorrect}/${d.totalMarks}</td>
      <td><span class="grade-pill g-${esc(d.grade)}">${esc(d.grade)}</span></td>
      <td>${d.pdfUrl ? `<a class="pdf-link" href="${esc(d.pdfUrl)}" target="_blank" rel="noopener">📄 Open PDF</a>` : '<span class="pdf-missing">Haipo</span>'}</td>
    </tr>
  `).join('');
}

if(sessionStorage.getItem('admin_pw')) load();
</script>
</body>
</html>
